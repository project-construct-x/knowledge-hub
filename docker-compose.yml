services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./dev-realm.json:/opt/keycloak/data/import/dev-realm.json

  db:
    image: postgres:16
    container_name: knowledge-hub_db-dev-user1
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: dev_pass_user1
      POSTGRES_DB: appdb_dev_user1
    ports:
      - "5432:5432"
    volumes:
      - db_data_dev:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knowledge-hub_backend-user1
    ports:
      - "8001:8001"
    environment:
      - APP_ENV=development
    depends_on:
      - db
      - keycloak
    volumes:
      - ./backend:/app
      - static_images_volume_dev:/app/static/images
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knowledge-hub_frontend-user1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  db_data_dev:
    name: knowledge-hub_db_data_dev_user1
  static_images_volume_dev:
    name: knowledge-hub_static_images_dev_user1
  keycloak_data:
