apiVersion: v1
kind: Service
metadata:
  name: knowledge-hub-frontend
spec:
  selector:
    app: knowledge-hub-frontend
  ports:
    - port: 80
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-hub-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledge-hub-frontend
  template:
    metadata:
      labels:
        app: knowledge-hub-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          ports:
            - containerPort: 80
      imagePullSecrets:
        - name: knowledge-hub-registry-creds