apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: knowledge-hub-backend-images-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.backend.storage.className }}
  resources:
    requests:
      storage: {{ .Values.backend.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-hub-backend
spec:
  selector:
    app: knowledge-hub-backend
  ports:
    - port: 8080
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-hub-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledge-hub-backend
  template:
    metadata:
      labels:
        app: knowledge-hub-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: {{ printf "postgresql://%s:%s@knowledge-hub-db:5432/%s" .Values.db.user .Values.db.password .Values.db.db | quote }}
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak_client_secret
                  key: KEYCLOAK_CLIENT_SECRET
            - name: SESSION_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: session_secret_key
                  key: SESSION_SECRET_KEY
          volumeMounts:
            - name: static-images
              mountPath: "/app/static/images"
      volumes:
        - name: static-images
          persistentVolumeClaim:
            claimName: knowledge-hub-backend-images-pvc
      imagePullSecrets:
        - name: knowledge-hub-registry-creds