apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knowledge-hub
  annotations:
    cert-manager.io/cluster-issuer:
      {{ .Values.ingress.clusterIssuer | quote }}
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: knowledge-hub-tls
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: knowledge-hub-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: knowledge-hub-frontend
                port:
                  number: 80
